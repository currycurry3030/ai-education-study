<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ctext y='19' font-size='20'%3E%F0%9F%93%8B%3C/text%3E%3C/svg%3E" />
<link
  rel="stylesheet"

  crossorigin

<title>프롬프트 Copy Book</title>
<style>
  :root {
    --color-brand: #6a5af9;
    --color-brand-alt: #4e8cf7;
    --color-brand-soft: #f1efff;
    --color-text: #14141a;
    --color-text-muted: #71717a;
    --color-border: #ececf0;
    --color-bg: #ffffff;
    --color-bg-subtle: #f7f7f9;
    --color-ink: #101014;
    --color-success-text: #1f9254;
    --color-danger-text: #d64545;
    --radius-sm: 10px;
    --header-height: 64px;
  }

  * {
    box-sizing: border-box;
  }

  html, body {
    height: 100%;
  }

  body {
    margin: 0;
    font-family: "Pretendard", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    color: var(--color-text);
    background: var(--color-bg-subtle);
  }

  a {
    color: inherit;
  }

  .copybook {
    min-height: 100%;
    display: flex;
    flex-direction: column;
  }

  .copybook__topbar {
    display: flex;
    align-items: center;
    gap: 10px;
    height: var(--header-height);
    padding: 0 24px;
    background: var(--color-bg);
    border-bottom: 1px solid var(--color-border);
    flex-shrink: 0;
  }

  .copybook__logo {
    width: 26px;
    height: 26px;
    border-radius: 8px;
    background: linear-gradient(135deg, #6a5af9 0%, #4e8cf7 100%);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .copybook__brand {
    font-size: 15px;
    font-weight: 800;
    letter-spacing: -0.3px;
  }

  .copybook__brand-sub {
    font-size: 12px;
    color: var(--color-text-muted);
    margin-left: 2px;
  }

  .copybook__body {
    flex: 1;
    display: flex;
    min-height: 0;
  }

  .copybook__sidebar {
    width: 220px;
    flex: 0 0 220px;
    background: var(--color-ink);
    color: #c7ccd6;
    display: flex;
    flex-direction: column;
    padding: 20px 0;
    overflow-y: auto;
  }

  .copybook__sidebar-hint {
    margin: 0 20px 14px;
    font-size: 11px;
    color: #8b93a3;
  }

  .copybook__nav-item {
    all: unset;
    box-sizing: border-box;
    display: block;
    width: 100%;
    padding: 11px 20px;
    cursor: pointer;
    font-size: 14px;
    border-left: 3px solid transparent;
    transition: background 0.15s ease, color 0.15s ease;
  }

  .copybook__nav-item:hover {
    background: rgba(255, 255, 255, 0.06);
    color: #fff;
  }

  .copybook__nav-item.is-active {
    background: rgba(106, 90, 249, 0.22);
    border-left-color: var(--color-brand-alt);
    color: #fff;
    font-weight: 700;
  }

  .copybook__main {
    flex: 1;
    overflow-y: auto;
    padding: 32px 40px 80px;
  }

  .copybook__title {
    margin: 0 0 4px;
    font-size: 22px;
    font-weight: 800;
    letter-spacing: -0.5px;
  }

  .copybook__desc {
    margin: 0 0 28px;
    font-size: 13px;
    color: var(--color-text-muted);
  }

  .copybook__unit {
    margin-bottom: 14px;
  }

  .copybook__divider {
    border: 0;
    border-top: 1px dashed var(--color-border);
    margin: 34px 0 22px;
  }

  .copybook__unit-title {
    display: inline-block;
    background: var(--color-brand-soft);
    color: #4c3fd1;
    font-size: 14px;
    font-weight: 700;
    padding: 7px 14px;
    border-radius: var(--radius-sm);
    margin-bottom: 16px;
  }

  .copybook__card {
    position: relative;
    background: var(--color-bg);
    border: 1px solid var(--color-border);
    border-radius: var(--radius-sm);
    padding: 16px 48px 16px 46px;
    margin-bottom: 12px;
    cursor: pointer;
    line-height: 1.65;
    font-size: 14.5px;
    white-space: pre-wrap;
    word-break: break-word;
    transition: border-color 0.15s ease, box-shadow 0.15s ease, transform 0.05s ease;
  }

  .copybook__card:hover {
    border-color: var(--color-brand-alt);
    box-shadow: 0 4px 14px rgba(106, 90, 249, 0.14);
  }

  .copybook__card:active {
    transform: scale(0.998);
  }

  .copybook__card-num {
    position: absolute;
    left: 14px;
    top: 16px;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: var(--color-brand-soft);
    color: var(--color-brand);
    font-size: 12px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .copybook__card-hint {
    position: absolute;
    right: 14px;
    top: 14px;
    font-size: 11px;
    color: #b6bcc7;
  }

  .copybook__card:hover .copybook__card-hint {
    color: var(--color-brand-alt);
  }

  .copybook__card.is-copied {
    border-color: var(--color-success-text);
    box-shadow: 0 4px 14px rgba(31, 146, 84, 0.18);
  }

  .copybook__card.is-copied .copybook__card-hint {
    color: var(--color-success-text);
    font-weight: 700;
  }

  .copybook__toast {
    position: fixed;
    left: 50%;
    bottom: 36px;
    transform: translateX(-50%) translateY(20px);
    background: var(--color-ink);
    color: #fff;
    padding: 11px 22px;
    border-radius: 24px;
    font-size: 13.5px;
    z-index: 100;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease, transform 0.2s ease;
  }

  .copybook__toast.is-show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  .copybook__toast.is-error {
    background: var(--color-danger-text);
  }

  @media (max-width: 720px) {
    .copybook__body {
      flex-direction: column;
    }

    .copybook__sidebar {
      width: 100%;
      flex: 0 0 auto;
      flex-direction: row;
      overflow-x: auto;
      padding: 12px 8px;
    }

    .copybook__sidebar-hint {
      display: none;
    }

    .copybook__nav-item {
      flex-shrink: 0;
      border-left: none;
      border-bottom: 3px solid transparent;
      white-space: nowrap;
    }

    .copybook__nav-item.is-active {
      border-left-color: transparent;
      border-bottom-color: var(--color-brand-alt);
    }

    .copybook__main {
      padding: 24px 20px 60px;
    }
  }
</style>
</head>
<body>

<div class="copybook">
  <header class="copybook__topbar">
    <span class="copybook__logo" aria-hidden="true"></span>
    <span class="copybook__brand">AI Studio</span>
    <span class="copybook__brand-sub">· 프롬프트 Copy Book</span>
  </header>

  <div class="copybook__body">
    <nav class="copybook__sidebar" id="nav" aria-label="챕터 목록">
      <p class="copybook__sidebar-hint">클릭하면 복사됩니다</p>
    </nav>

    <main class="copybook__main">
      <h2 class="copybook__title" id="chapterTitle"></h2>
      <p class="copybook__desc">카드를 클릭하면 해당 프롬프트가 클립보드에 복사됩니다.</p>
      <div id="content"></div>
    </main>
  </div>

  <div class="copybook__toast" id="toast"></div>
</div>

<script type="text/plain" class="chapter-data" data-label="Chapter 2">
[Unit 06] 필수로 다루어야 할 AI Top 4 툴 소개
---
1) 2020 ~ 2026년 메모리 시장 트렌드 조사해 2) 2027 ~ 2035년 로봇 기술 트렌드 조사해줘 3) 지금까지 조사한 메모리 트렌드와 로봇 트렌드를 결합하여 메모리 미래 예측 인사이트 문서를 작성해줘

중학생도 이해할 수 있도록 두줄 요약해줘

이제 고등학생 수준으로 10줄 요약해줘

원문에 쓰인 워딩을 사용하여 20줄로 요약해줘

할 일을 추가하고, 할 일 목록을 체크해보는 툴을 만들어줘 Web App으로 만들고, 할 일 목록 이동도 되고, 삭제도  되게끔 해줘,   UI는 심플, 파스텔톤
---
</script>

<script type="text/plain" class="chapter-data" data-label="Chapter 3">
[Unit 01] AI를 활용한 콘텐츠 생성 및 문서 제작
---
스마트폰 신제품을 기획해보고자 해. AI 기능이 강조된 새로운 스마트폰 런칭 기획안의 초안을 문서로 작성해줘. 제품명, 슬로건, 핵심 셀링포인트 3가지(온디바이스 AI 처리 속도 포함), 타겟 고객, 경쟁제품 대비 강점을 포함해줘.

첨부한 스마트폰 신제품 런칭 기획서를 검토해줘. 논리적 허점, 근거 불명확한 수치, 빠진 내용을 지적해줘.

Gemini Pro 모델이 검토한 피드백을 너에게 전달 해줄께

교정한 내용 참고해서 디자인이 멋지게 보여지는 핸드폰 이미지 생성해. 글자는 없어야해. 고급스럽게. 카메라 렌즈는 9개로 해줘.

방금 만든 이미지에서 완성본을 확인 수 있는 앞, 뒤 이미지와 디자인 특징을 설명하는 컨셉 사진 (기술 Spec은 빼 줘)

방금 만든 이미지의 제품이 분해되어 메인보드와 칩셋이 표현되면서 세부 스펙을 명시한 이미지

첨부한 이미지를 제품 소개 슬라이드에 사용해서, 이 문서 내용 기반으로 5장짜리 스마트폰 신제품 런칭 발표자료를 만들어줘.
---
</script>

<script type="text/plain" class="chapter-data" data-label="Chapter 4">
[Unit 03] 프롬프트 엔지니어링 가이드
---
HBM과 SSD의 느린 속도를 보완하기 위한 HBF 기술을 설명하고, 이에 대한 성능 예측 발표 자료를 작성 해야 해. 내가 만들어달라고 직접적으로 말할 때 까지 만들지 마. 그런데 내가 HBM, SSD, HBF 에 대해 뭔지 잘 몰라 중학생도 이해할 수 있게 설명을 짧고 쉽게 해줘

HBM은 엄청 빠른 메모리이고 SSD는 저장장치인데 느려서 병목 현상이 생기니까, 이 사이에 HBF를 하나 추가하면 병목을 줄일 수 있다는 것이지? 내가 이해한 것이 맞아?

나를 위해 HBM, SSD, HBF를 쉽게 이해할 수 있는 인터랙티브한 Web App을 하나 만들어줘. 중학생도 이해할 수 있도록 해줘

지금부터 브레인스토밍을 해볼게  어떤 흐름으로 발표 자료를 제작하면 좋을까? 개념도 설명해야 하고,  성능도 알려줘야 하고,  결론도 내야하고 하거든

HBF로 인해 성능이 좋아질 수 있음을 효과적으로 설명할 수 있는 후보 3개를 보여주는 인터랙티브한 Web App을 만들어줘. 후보 1, 2, 3 중에 마음에 드는 것을 내가 채팅으로 알려줄게

후보 1이 마음에 드네

발표 자료를 제작하기 전, 모호한 부분은 한번에 하나씩 질문해 줘

지금까지 대화를 기반으로 발표 자료를 제작해. Web 기반으로 만들어. 인터랙티브하게 만들어줘.

발표 자료 내용을 내가 완벽히 이해했는지 확인하는 용도로 O, X 퀴즈 4개를 내줘

아래는 네 가지 프롬프트 엔지니어링 기법이야 1. Blindspot Pass : 내가 알지 못하는 부분 설명해달라고 하기 2. Prototypes : 본인이 선택할 수 있는 선택지를 달라고 AI에게 요청한다. 3. Interviews : AI가 본인에게 궁금한 것을 물어보도록 요청한다. 4. Quizzes : 이해도를 높이기 위한 퀴즈를 내달라고 AI에게 요청한다. 위 네 가지 기법 별로, 내가 어떤 프롬프팅을 했었는지 정리한 HTML 문서를 만들어줘.
---
</script>

<script type="text/plain" class="chapter-data" data-label="Chapter 5">
[Unit 01] AI활용 Workflow 배경
---
내가 지금 어떤 상황인지 설명해 볼게. 우선 상황만 이해해 줘. (내가 요청하기 전까지는 제안서를 작성하지 말아 줘.) # 나는 AI 엔지니어 직무이고, 공정 AI팀으로 배치되었지. # 클린 장비에서 작업을 마친 웨이퍼는 웨이퍼 이송 장비(카트)에 자동으로 실려 이동해. # 카트에 카메라를 설치할 수 있는데, 초정밀 카메라를 설치하면 고해상도 사진이나 적외선 사진 등 다양한 이미지 정보를 얻을 수 있어. # 이미지만 확보되면 AI 기술을 활용해 불량 여부를 판별할 수 있어. 이 부분은 내가 전문성을 갖추고 있어서 어렵지 않아. # 불량으로 판정되면 카트가 웨이퍼를 클린 장비로 다시 이송하도록 신호를 보낼 수 있어. 불량 정도가 심하면 폐기하도록 신호를 보내고, 장비는 그 신호에 따라 동작한대. # 그런데 내가 반도체 공정에 대한 도메인 지식이 부족해서, 위 내용을 바탕으로 제안서를 작성하고 싶지만 어떻게 작성해야 할지 모르겠어.

도메인 지식이 전혀 없는 상황인데 내가 알아야 할 내용이 뭐가 있을까? 핵심 키워드와 과정을 중학생도 쉽게 이해할 수 있는 설명을 Web App으로 생성해서 보여줘

혹시 내가 어떤 상황인지에 대해  덜 설명한 게 있는지 모르겠네 한번 나를 인터뷰해줘,  (한번에 하나의 질문 씩 해줘 시간관계상 중요한 거 2개만 답변할 거야)

목적 / 배경을 정리해서 글로 정리해봐

---
[UNIT 02] 데이터 수집
---
사용할 수 있는 초정밀카메라 종류에 대해 조사를 해줘

목적과 유사한 사례가 있는지 실제 사례 및 제품 등 조사해줘

---
[UNIT 03] 데이터 선별
---
프로젝트 목적과 관련된 조사 자료 2개를 줄게. 조사한 자료에 대해, 최종 제안서에 사용할 데이터를 선별하고자 해  먼저 내용을 모두 이해만 해줘. 조사한 자료 중에 쓸만하거나,  불필요한 부분에 대해 내가 직접 의견을 줄꺼야. 일단 가볍게 대화만 시작해보자.

Latency 데이터는 모두 빼자. 동일한 조건으로 Latency 측정이 아닌 것 같아.

적외선 카메라랑 비전 카메라 2개 말고는 불필요할 것 같아

상용 솔루션 사례는 모두 마음에 안 들어. 모두 빼자.

---
[UNIT 04] 슬라이드 제안서 작성
---
프레젠테이션 형태의 제안서를 만들기 전에, 먼저 계획을 세워줘. 계획을 내가 검토해볼꺼야 각 Page별로 어떤 내용을 구성할지 제안서 작성을 위한 계획문서 작성해줘

전달한 주제에 대해 슬라이드를 만들 것인데 컬러 디자인시스템을 아직 못 정했어. 밝은 것부터 어두운 배경을 포함해서 디자인시스템 후보 16개를 보여주는 인터랙티브한 Web App을 만들어줘. 후보 1 ~ 16개 중에 마음에 드는 것 내가 선택해서 대답해줄께

후보 2번으로 슬라이드 제안서 만들어줘

---

<script>
(function () {
  "use strict";

  // ---------- txt 파싱 ----------
  // [Unit NN] 제목  →  --- 내용 ---  구조를 파싱한다. (src/pages/copybookPrompts.ts와 동일한 규칙)
  function parseChapter(raw) {
    var lines = raw.split(/\r?\n/);
    var units = [];
    var i = 0;

    while (i < lines.length) {
      var header = lines[i].match(/^\s*\[(unit[^\]]*)\]\s*(.*)$/i);
      if (!header) { i++; continue; }
      var num = header[1].replace(/unit/i, "Unit").trim();
      var name = header[2].trim();
      i++;

      while (i < lines.length && lines[i].trim() === "") i++;
      if (i < lines.length && lines[i].trim() === "---") i++;

      var body = [];
      while (i < lines.length && lines[i].trim() !== "---") {
        body.push(lines[i]); i++;
      }
      if (i < lines.length && lines[i].trim() === "---") i++;

      var prompts = body.join("\n").split(/\n\s*\n/)
        .map(function (s) { return s.trim(); })
        .filter(Boolean);

      units.push({ num: num, name: name, prompts: prompts });
    }
    return units;
  }

  // ---------- 데이터 수집 ----------
  var chapters = Array.prototype.map.call(
    document.querySelectorAll("script.chapter-data"),
    function (el) {
      return { label: el.getAttribute("data-label"), units: parseChapter(el.textContent) };
    }
  ).filter(function (c) { return c.units.length > 0; });

  // ---------- 렌더링 ----------
  var navEl = document.getElementById("nav");
  var contentEl = document.getElementById("content");
  var titleEl = document.getElementById("chapterTitle");

  function renderNav(activeIdx) {
    Array.prototype.slice.call(navEl.querySelectorAll(".copybook__nav-item")).forEach(function (el) { el.remove(); });
    chapters.forEach(function (ch, idx) {
      var item = document.createElement("button");
      item.type = "button";
      item.className = "copybook__nav-item" + (idx === activeIdx ? " is-active" : "");
      item.textContent = ch.label;
      item.addEventListener("click", function () { selectChapter(idx); });
      navEl.appendChild(item);
    });
  }

  function renderChapter(ch) {
    titleEl.textContent = ch.label;
    contentEl.innerHTML = "";
    ch.units.forEach(function (unit, uIdx) {
      if (uIdx > 0) {
        var hr = document.createElement("hr");
        hr.className = "copybook__divider";
        contentEl.appendChild(hr);
      }

      var wrap = document.createElement("section");
      wrap.className = "copybook__unit";

      var title = document.createElement("div");
      title.className = "copybook__unit-title";
      title.textContent = unit.name ? (unit.num + " · " + unit.name) : unit.num;
      wrap.appendChild(title);

      unit.prompts.forEach(function (text, pIdx) {
        var card = document.createElement("div");
        card.className = "copybook__card";
        card.setAttribute("role", "button");
        card.setAttribute("tabindex", "0");

        var num = document.createElement("span");
        num.className = "copybook__card-num";
        num.textContent = pIdx + 1;
        card.appendChild(num);

        var hint = document.createElement("span");
        hint.className = "copybook__card-hint";
        hint.textContent = "📋 복사";
        card.appendChild(hint);

        var body = document.createElement("span");
        body.textContent = text;
        card.appendChild(body);

        card.addEventListener("click", function () { copyText(text, card, hint); });
        card.addEventListener("keydown", function (e) {
          if (e.key === "Enter" || e.key === " ") { e.preventDefault(); copyText(text, card, hint); }
        });

        wrap.appendChild(card);
      });

      contentEl.appendChild(wrap);
    });
    contentEl.parentElement.scrollTop = 0;
  }

  var currentIdx = -1;
  function selectChapter(idx) {
    if (idx === currentIdx) return;
    currentIdx = idx;
    renderNav(idx);
    renderChapter(chapters[idx]);
  }

  // ---------- 복사 ----------
  function copyText(text, card, hint) {
    function done(ok) {
      showToast(ok);
      if (ok) {
        card.classList.add("is-copied");
        var prev = hint.textContent;
        hint.textContent = "복사됨 ✓";
        window.setTimeout(function () {
          card.classList.remove("is-copied");
          hint.textContent = prev;
        }, 900);
      }
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { done(true); }).catch(function () { done(fallbackCopy(text)); });
    } else {
      done(fallbackCopy(text));
    }
  }

  function fallbackCopy(text) {
    var ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.top = "-1000px";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.focus(); ta.select();
    var ok = false;
    try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
    document.body.removeChild(ta);
    return ok;
  }

  // ---------- 토스트 ----------
  var toastEl = document.getElementById("toast");
  var toastTimer = null;
  function showToast(ok) {
    toastEl.textContent = ok ? "✓ 클립보드에 복사되었습니다" : "복사에 실패했습니다";
    toastEl.className = "copybook__toast is-show" + (ok ? "" : " is-error");
    if (toastTimer) window.clearTimeout(toastTimer);
    toastTimer = window.setTimeout(function () { toastEl.className = "copybook__toast"; }, 1600);
  }

  // ---------- 시작 ----------
  if (chapters.length) {
    renderNav(0);
    selectChapter(0);
  } else {
    titleEl.textContent = "표시할 프롬프트가 없습니다.";
  }
})();
</script>
